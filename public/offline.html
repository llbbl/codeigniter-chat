<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f6398" />
    <title>CodeIgniter Chat is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; color: #343a40; font: 1rem/1.5 system-ui, sans-serif; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border-radius: .75rem; background: #fff; box-shadow: 0 2px 12px rgb(0 0 0 / 12%); text-align: center; }
      h1 { color: #3f6398; }
      button { border: 0; border-radius: .3rem; padding: .7rem 1rem; background: #3f6398; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>The chat shell is available, but live messages need a connection. Reconnect and retry this page.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
